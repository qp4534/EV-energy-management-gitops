apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charging-demand
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qp4534/EV-energy-management-gitops.git
    targetRevision: main
    path: apps/charging-demand
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
