# kube-prometheus-stack(monitoring 네임스페이스)의 Prometheus가 backend의
# /actuator/prometheus를 스크랩하도록 등록한다. release: kps 라벨이 있어야
# Prometheus CR의 serviceMonitorSelector에 걸린다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: backend
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
