apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # shares one ALB with the frontend Ingress instead of creating a second one
    alb.ingress.kubernetes.io/group.name: ev-mgmt
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # apex cert (mijungev.kro.kr) as default + wildcard cert (*.mijungev.kro.kr) added
    # for SNI so www./other subdomains get a matching cert too
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:242254325514:certificate/ca26e3ca-03f6-4026-aa66-94adb6e1aa16,arn:aws:acm:ap-northeast-2:242254325514:certificate/51d6c343-35bd-42f3-b1f3-75d3ddaa7809
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-2:242254325514:regional/webacl/ev-mgmt-external-waf/9bba8771-8582-43fa-b660-a82d4bf72f2c
    # 이 서비스에 ingress가 2개(외부/내부)가 되면서 readinessProbe 기반 자동유추가 깨져 헬스체크
    # 경로가 기본값 "/"(401)로 떨어졌다 - 두 ingress 모두에 명시적으로 고정한다
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
spec:
  rules:
    - host: mijungev.kro.kr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
    - host: www.mijungev.kro.kr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
