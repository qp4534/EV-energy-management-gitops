# 관리자/관제 전용 내부 ALB - 외부 인터넷에서 라우팅 경로가 없고(scheme: internal),
# AWS Client VPN(사설 IP 10.100.0.0/22)으로 접속한 사람만 SG로 허용된다.
# 같은 frontend 서비스를 그대로 재사용 - 앱 코드/이미지는 외부용과 동일하고, 진입 경로만 다르다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-internal
  namespace: frontend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: ev-mgmt-internal
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/security-groups: sg-021f75fa82918eca5
    # apex/와일드카드 인증서 중 와일드카드(*.mijungev.kro.kr)만 admin.mijungev.kro.kr를 커버한다
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:242254325514:certificate/51d6c343-35bd-42f3-b1f3-75d3ddaa7809
spec:
  rules:
    - host: admin.mijungev.kro.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
