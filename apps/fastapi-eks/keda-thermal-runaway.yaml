# 열폭주(thermal runaway) 감지/시나리오 워크로드(ev-ai-inference-api)를 SQS 큐 길이
# 기준으로 오토스케일링한다. KEDA operator가 IRSA(ev-mgmt-keda-sqs-reader 역할)로
# 큐 depth를 조회해 HPA를 대신 관리한다.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-sqs-reader-auth
  namespace: fastapi
spec:
  podIdentity:
    provider: aws
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ev-ai-inference-api-thermal-runaway
  namespace: fastapi
spec:
  scaleTargetRef:
    name: ev-ai-inference-api
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-sqs-reader-auth
      metadata:
        queueURL: https://sqs.ap-northeast-2.amazonaws.com/242254325514/ev-mgmt-thermal-runaway-queue
        queueLength: "5"
        awsRegion: ap-northeast-2
