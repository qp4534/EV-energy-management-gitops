apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ev-ai-inference-api
  namespace: fastapi
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Shares the existing ev-mgmt ALB with backend/frontend.
    # order 5 is evaluated before backend(/api, order 10), so
    # /api/v1/twins is routed to FastAPI instead of Spring.
    alb.ingress.kubernetes.io/group.name: ev-mgmt
    alb.ingress.kubernetes.io/group.order: "5"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # apex cert (mijungev.kro.kr) as default + wildcard cert (*.mijungev.kro.kr) added
    # for SNI so www./other subdomains get a matching cert too
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:242254325514:certificate/ca26e3ca-03f6-4026-aa66-94adb6e1aa16,arn:aws:acm:ap-northeast-2:242254325514:certificate/51d6c343-35bd-42f3-b1f3-75d3ddaa7809
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-2:242254325514:regional/webacl/ev-mgmt-external-waf/9bba8771-8582-43fa-b660-a82d4bf72f2c
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  rules:
    - host: mijungev.kro.kr
      http:
        paths:
          - path: /api/v1/twins
            pathType: Prefix
            backend:
              service:
                name: ev-ai-inference-api
                port:
                  number: 80
    - host: www.mijungev.kro.kr
      http:
        paths:
          - path: /api/v1/twins
            pathType: Prefix
            backend:
              service:
                name: ev-ai-inference-api
                port:
                  number: 80
