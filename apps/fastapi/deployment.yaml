apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-ai-inference-api
  namespace: fastapi
  labels:
    app: ev-ai-inference-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ev-ai-inference-api
  template:
    metadata:
      labels:
        app: ev-ai-inference-api
    spec:
      containers:
        - name: api
          # The matching FastAPI image must be pushed before Argo CD syncs this application.
          image: qp4534/ev-energy-management-fastapi:1aa2c58501f2be4a692f3d77ebbe44d9e0c148f0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: MODEL_BUNDLE_DIR
              value: /app/model_bundles/current_stage_v1/ev_battery_safety_inference_v1
            - name: ANOMALY_PERSISTENCE_ENABLED
              value: "true"
            # The shared RDS schema uses ANOMALY_LOGS/TWIN_FRAMES, not the old twin_incidents tables.
            - name: TWIN_INFRA_REQUIRED
              value: "false"
            # The unified /twins endpoint always uses Redis for live state.
            - name: TWIN_REDIS_REQUIRED
              value: "true"
            - name: EMBEDDED_AI_ENABLED
              value: "true"
            - name: REPORT_JOBS_ENABLED
              value: "true"
            - name: REPORT_WORKER_ENABLED
              value: "true"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fastapi-secret
                  key: DEEPSEEK_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
