apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: qp4534/ev-energy-management-backend:6ff615722189a0e70fbaafb114936a4acc25adf7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                # give the ingress a moment to stop routing here before the process dies
                command: ["sh", "-c", "sleep 5"]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -Xss512k"
            # value comes from the "db-secret" Secret (created by the backend repo's
            # deploy workflow), not stored here
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
