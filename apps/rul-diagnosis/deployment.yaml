apiVersion: apps/v1
kind: Deployment
metadata:
  name: rul-diagnosis
  namespace: fastapi
  labels:
    app: rul-diagnosis
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: rul-diagnosis
  template:
    metadata:
      labels:
        app: rul-diagnosis
    spec:
      containers:
        - name: api
          # 모델 파일(304MB+125MB)이 이미지 안에 이미 구워져 있음 - S3에서 CI 빌드 시점에
          # 받아서 COPY. .github/workflows/deploy-rul-diagnosis.yml 참고.
          image: qp4534/ev-rul-diagnosis:10065d26535e8b62e255522ce518995a4e7cd60a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # /pipeline에서 include_report=true일 때만 필요(Claude 종합 리포트).
            # /report/pdf, /diagnose/erd, include_report=false인 /pipeline은 키 없이 동작.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rul-diagnosis-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            # 매입처 실시간 검색(buyer_lookup.py) - Serper(검색)+DeepSeek(요약) 조합.
            # 둘 다 없으면 fetch_buyer_disclosure/discover_buyers가 자동으로 None을
            # 반환하고, 화면/PDF는 기존 정적 매입처 목록(valuation.BUYERS)으로 폴백한다.
            - name: SERPER_API_KEY_NH
              valueFrom:
                secretKeyRef:
                  name: rul-diagnosis-secret
                  key: SERPER_API_KEY_NH
                  optional: true
            - name: DEEPSEEK_API_KEY_NH
              valueFrom:
                secretKeyRef:
                  name: rul-diagnosis-secret
                  key: DEEPSEEK_API_KEY_NH
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # joblib으로 304MB+125MB 모델을 기동 시 1회 로드하므로 넉넉하게 잡음
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
