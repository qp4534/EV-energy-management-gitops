# rul-diagnosis is called synchronously over HTTP by Spring Boot.
# Scale it from the workload's real CPU utilization instead of an SQS queue
# that has no producer/consumer in the application request path.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rul-diagnosis-battery-diagnosis
  namespace: fastapi
spec:
  scaleTargetRef:
    name: rul-diagnosis
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "60"
